services:
  db:
    image: mysql:8.4
    container_name: gestao_frota_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
      
  traccar:
    image: traccar/traccar:6.16.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
      - "192.168.1.227:5055:5055"
    volumes:
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs

  web:
    build: .
    container_name: gestao_frota
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    build: .
    container_name: gestao_frota_tailwind
    command: python manage.py tailwind --skip-checks watch
    volumes:
      - .:/app
    env_file:
      - .env
    tty: true          
    stdin_open: true

volumes:
  mysql_data:
  traccar_data:
  traccar_logs: