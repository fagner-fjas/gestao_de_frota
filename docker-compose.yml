# Ambiente de desenvolvimento / demonstração (não é configuração de produção).
# Portas do host são configuráveis no .env para funcionar em outros PCs.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Configure DB_NAME no .env}
      MYSQL_USER: ${DB_USER:?Configure DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  traccar:
    image: traccar/traccar:6.16.0
    restart: unless-stopped
    ports:
      # Interface de administração acessível apenas no próprio PC.
      - "127.0.0.1:${TRACCAR_WEB_PORT:-8082}:8082"
      # Padrão local; para GPS na rede, configure IP do PC no .env.
      - "${TRACCAR_DEVICE_BIND_IP:-127.0.0.1}:${TRACCAR_DEVICE_PORT:-5055}:5055"
    volumes:
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    build: .
    command: python manage.py tailwind --skip-checks watch
    volumes:
      - .:/app
    env_file:
      - .env
    tty: true
    stdin_open: true

volumes:
  mysql_data:
  traccar_data:
  traccar_logs:
