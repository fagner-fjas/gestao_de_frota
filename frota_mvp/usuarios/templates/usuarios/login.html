{% extends 'base.html' %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<h1>Login</h1>
<form method="post">
  {% csrf_token %}
  <p><label>Usuário:<br><input type="text" name="username" required autofocus></label></p>
  <p><label>Senha:<br><input type="password" name="password" required></label></p>
  <button type="submit" class="botao">Entrar</button>
</form>
<p><a href="{% url 'cadastro' %}">Criar um usuário</a></p>
{% endblock %}
