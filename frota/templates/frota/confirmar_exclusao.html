{% extends 'base.html' %}
{% block titulo %}Excluir {{ nome }}{% endblock %}
{% block conteudo %}
<div class="cartao max-w-xl">
  <h1 class="text-title-xs font-semibold text-gray-800">Excluir {{ nome }}</h1>
  <p class="mt-3 text-sm text-gray-600">
    Deseja realmente excluir <strong class="text-gray-800">{{ object }}</strong>? Esta ação não pode ser desfeita.
  </p>
  <form method="post" class="mt-6 flex gap-3">
    {% csrf_token %}
    <button type="submit" class="botao-perigo">Sim, excluir</button>
    <a href="{% url url_base|add:'_detalhe' object.pk %}" class="botao-secundario">Cancelar</a>
  </form>
</div>
{% endblock %}
