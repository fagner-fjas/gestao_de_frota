<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Rastreamento de Frota</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    #map {
      height: 65vh;
      min-height: 400px;
      border-radius: 12px;
    }

    .status {
      margin: 12px 0;
      color: #334155;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Rastreamento da Frota</h1>

    <p id="status" class="status">
      Carregando posições...
    </p>

    <div id="map"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    const map = L.map("map").setView(
      [-7.67, -36.88], 11
    );

    L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    referrerPolicy: "strict-origin-when-cross-origin",
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }
).addTo(map);

    const markers = L.layerGroup().addTo(map);
    const statusElement =
      document.getElementById("status");

    let firstLoad = true;

    async function atualizarMapa() {
      try {
        const response = await fetch(
          "{% url 'rastreamento_dados' %}",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "Erro ao consultar rastreamento"
          );
        }

        const data = await response.json();

        markers.clearLayers();

        const pontos = [];

        for (const veiculo of data.veiculos) {
          const lat = Number(veiculo.latitude);
          const lon = Number(veiculo.longitude);

          if (!Number.isFinite(lat) ||
              !Number.isFinite(lon)) {
            continue;
          }

          const marker = L.marker(
            [lat, lon]
          ).addTo(markers);

          const popup = document.createElement("div");

          const titulo = document.createElement("strong");
          titulo.textContent = veiculo.placa;

          const descricao = document.createElement("p");
          descricao.textContent =
            `${veiculo.modelo} — ${veiculo.status}`;

          const horario = document.createElement("small");
          horario.textContent = veiculo.horario
            ? `Última posição: ${
                new Date(veiculo.horario)
                  .toLocaleString("pt-BR")
              }`
            : "Horário não informado";

          popup.append(titulo, descricao, horario);

          marker.bindPopup(popup);

          pontos.push([lat, lon]);
        }

        if (firstLoad && pontos.length > 0) {
          map.fitBounds(
            L.latLngBounds(pontos).pad(0.2),
            { maxZoom: 15 }
          );
          firstLoad = false;
        }

        statusElement.textContent =
          `${pontos.length} veículo(s) com posição. ` +
          "Atualização a cada 15 segundos.";

      } catch (error) {
        statusElement.textContent =
          "Não foi possível atualizar o rastreamento.";
        console.error(error);
      }
    }

    atualizarMapa();
    setInterval(atualizarMapa, 15000);
  </script>
</body>
</html>
