{% for mensagem in messages %}
  <div x-data="{ aberto: true }" x-show="aberto"
       class="mb-4 flex items-start justify-between gap-3 rounded-xl border p-4 text-sm
              {% if mensagem.tags == 'success' %}border-success-500 bg-success-50 text-success-700
              {% elif mensagem.tags == 'error' %}border-error-500 bg-error-50 text-error-700
              {% elif mensagem.tags == 'warning' %}border-warning-500 bg-warning-50 text-warning-700
              {% else %}border-brand-300 bg-brand-50 text-brand-700{% endif %}">
    <span>{{ mensagem }}</span>
    <button type="button" @click="aberto = false" class="leading-none opacity-60 hover:opacity-100" aria-label="Fechar">&times;</button>
  </div>
{% endfor %}
