{% extends 'base_auth.html' %}
{% block titulo %}Entrar{% endblock %}
{% block subtitulo %}Acesse sua conta para continuar{% endblock %}
{% block conteudo %}
<form method="post" class="space-y-5">
  {% csrf_token %}
  <div>
    <label for="username" class="rotulo">Usuário</label>
    <input id="username" type="text" name="username" required autofocus class="campo">
  </div>
  <div>
    <label for="password" class="rotulo">Senha</label>
    <input id="password" type="password" name="password" required class="campo">
  </div>
  <button type="submit" class="botao-primario w-full">Entrar</button>
</form>
<p class="mt-5 text-center text-sm text-gray-500">
  Não tem conta? <a href="{% url 'cadastro' %}" class="font-medium text-brand-500 hover:text-brand-600">Criar um usuário</a>
</p>
{% endblock %}
